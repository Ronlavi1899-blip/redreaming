  <!-- ═══ META PIXEL ═══ -->
  <script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '4064369010530258');
  fbq('track', 'PageView');

  // ═══════════════════════════════════════════════════════════════
  //  ⚠️  זמני. למחוק ברגע ש-CAPI עולה לאוויר.
  //
  //  הדף הזה קיים רק כדי לירות Purchase. הוא לא מכיל את המוצר,
  //  ולכן אף אחד לא ישמור אותו במועדפים ולא ישתף אותו - מה שמוריד
  //  משמעותית את הסיכון לרכישות מזויפות. קבצי המוצר יושבים ב-start.html.
  //
  //  כשה-META_ACCESS_TOKEN יוגדר ו-netlify/functions/payplus-callback.js
  //  יתחיל לדווח, חובה למחוק את הבלוק הזה באותו commit. אחרת כל רכישה
  //  תיספר פעמיים - הדפדפן שולח מזהה אקראי והשרת שולח את מזהה העסקה
  //  של PayPlus, ומטא לא תזהה שמדובר באותה רכישה.
  // ═══════════════════════════════════════════════════════════════
  (function () {
    // ניקוי המנעול הישן. הוא היה קבוע לכל החיים, כך שביקור בודד
    // בדף התודה חסם כל רכישה עתידית מאותו דפדפן - כולל רכישות אמיתיות.
    try { window.localStorage.removeItem('mb_purchase_fired'); } catch (e) {}

    // הגעה מדף פנימי באתר אינה חזרה מתשלום.
    // שים לב שאנחנו *לא* דורשים referrer של PayPlus - הרבה שערי תשלום
    // מסתירים אותו, וזה היה גורם לנו לפספס רכישות אמיתיות.
    try {
      if (document.referrer && new URL(document.referrer).origin === window.location.origin) return;
    } catch (e) {}

    // ═══ השער האמיתי: אסימון הצ'קאאוט ═══
    // script.js כותב אותו ברגע הלחיצה על כפתור הרכישה. referrer ריק
    // אינו מבדיל בין חזרה מ-PayPlus לבין מישהו שהקליד את הכתובת,
    // ולכן הוא לא יכול לשמש כשער. האסימון כן.
    var KEY = 'mb_checkout';
    var MAX_AGE_MS = 3 * 60 * 60 * 1000;   // אסימון ישן מזה = ביקור חוזר, לא רכישה

    var token = null;
    try { token = JSON.parse(window.localStorage.getItem(KEY) || 'null'); } catch (e) {}
    if (!token || typeof token.id !== 'string' || typeof token.t !== 'number') return;

    if (Date.now() - token.t > MAX_AGE_MS) {
      try { window.localStorage.removeItem(KEY); } catch (e) {}
      return;
    }

    // צורכים את האסימון *לפני* הירי, לא אחריו: אם המשתמש מרענן מיד,
    // הוא כבר לא קיים ולא ניתן לירות פעמיים. המזהה נשמר מרגע הלחיצה,
    // כך שגם ירי חוזר תיאורטי היה נושא את אותו eventID ומטא הייתה מאחדת.
    try { window.localStorage.removeItem(KEY); } catch (e) {}

    fbq('track', 'Purchase', {
      value: 247.00,
      currency: 'ILS',
      content_name: 'מסיוט לחלום',
      content_type: 'product'
    }, { eventID: token.id });
  })();
</script>
